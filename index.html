    <style>
      /* 這裡刻意不把 html/body 鎖死成 height:100vh/svh/dvh。之前那樣寫是為了配合
         App.jsx 最外層的 position:fixed 容器，但 iOS standalone 剛啟動時
         WebKit 回報的視窗高度本身常常是錯的（不管用哪個 API 量都一樣），導致
         那個 fixed 容器撐不滿畫面、底部留白，而且只有真實觸控捲動才能救回來。
         現在 App.jsx 已經改成不需要知道精確高度的寫法（body 自己用瀏覽器原生
         捲動，header/nav 用 position:sticky），所以這裡也對應簡化：只設定
         background 跟置中，不做任何「鎖高度」的事，從根本避開這整類 bug。 */
      html, body { margin: 0; }
      body {
        background: #070911;
        display: flex;
        justify-content: center;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        width: 100%;
        min-height: 100dvh;
        display: flex;
      }
    </style>
